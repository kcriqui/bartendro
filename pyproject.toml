[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bartendro"
dynamic = ["version"]
description = "Bartendro drink robot - Python 3 rewrite of the Raspberry Pi software"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "smbus2>=0.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# On Raspberry Pi OS gpiozero/lgpio come from apt (python3-gpiozero, python3-lgpio);
# create the venv with --system-site-packages instead of installing this extra.
pi = ["gpiozero>=2.0"]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5", "ruff>=0.6", "vulture>=2.11"]

[project.scripts]
bartendro-hw = "bartendro.cli:main"
bartendro-db = "bartendro.dbcli:main"
bartendro-web = "bartendro.web.server:main"

[tool.hatch.version]
path = "src/bartendro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bartendro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The repo lives on a NAS share where pytest can't write its cache (leaves pytest-cache-files-* dirs).
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 110
# the original project's code, and its old scripts (scripts/user_button.py is Python 2)
extend-exclude = ["ui", "firmware", "hardware", "build", "scripts/user_button.py"]

[tool.ruff.lint]
# defaults (pyflakes + pycodestyle errors) plus likely bugs (B), modern syntax (UP), simplifications
# (SIM), performance anti-patterns (PERF), import order (I)
extend-select = ["B", "UP", "SIM", "PERF", "I"]
# str + Enum, not StrEnum: str() of the members differs, and these are stored in the database
ignore = ["UP042"]
