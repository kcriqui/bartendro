[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bartendro"
dynamic = ["version"]
description = "Bartendro drink robot - Python 3 rewrite of the Raspberry Pi software"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "smbus2>=0.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
# On Raspberry Pi OS gpiozero/lgpio come from apt (python3-gpiozero, python3-lgpio);
# create the venv with --system-site-packages instead of installing this extra.
pi = ["gpiozero>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
bartendro-hw = "bartendro.cli:main"
bartendro-db = "bartendro.dbcli:main"

[tool.hatch.version]
path = "src/bartendro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bartendro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The repo lives on a NAS share where pytest can't write its cache (leaves pytest-cache-files-* dirs).
addopts = "-p no:cacheprovider"
