# Bundled drinks for Bartendro: `bartendro-db load-recipes` (or Admin > Drinks) adds them.
#
# Only drinks a bot can make on its own: a ratio of liquids poured straight into a glass of ice.
# Nothing shaken, stirred and strained, muddled, blended or dashed.
#
# Ingredient amounts are facts (classic and IBA specs, written in ml); the descriptions and
# instructions were written for this project. GPL-2.0 like the rest of the code.
#
# [[ingredient]]: the generic ingredients the drinks use.
#   aliases: other names for the same thing (matched against ingredients already in the
#            database, e.g. names from an old bartendro.db), so nothing is duplicated.
#   brands:  specific bottles that can stand in for it; an existing ingredient with one of
#            these names is linked to it (Kahlua -> Coffee Liqueur) unless it already has a link.
# [[drink]]: ingredients = [[amount, unit, ingredient], ...]; units ml, cl or oz.

# ------------------------------------------------------------------ spirits
[[ingredient]]
name = "Vodka"
kind = "alcohol"
abv = 40

[[ingredient]]
name = "White Rum"
kind = "alcohol"
abv = 40
