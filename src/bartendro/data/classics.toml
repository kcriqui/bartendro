# Bundled drinks for Bartendro: `bartendro-db load-recipes` (or Admin > Drinks) adds them.
#
# The bot pours the liquids; the guest may prepare the glass first and finish the drink after.
#   - poured straight into a glass of ice: no `finish`
#   - poured into a shaker or mixing glass, then shaken or stirred by the guest: `finish`
#     says what to do after the pour.
# By-hand lines are never pumped; the guest gets a checklist:
#   - counted amounts: units dash, drop, barspoon, pinch, splash, tsp, leaf, sprig, wedge,
#     slice, cube, piece ([2, "dash", "Angostura Bitters"]); "fill" for ice
#     ([1, "fill", "Ice", "before"] = "fill the glass with ice" before the pour)
#   - measured amounts of `manual` ingredients ([30, "ml", "Half and Half"]), scaled with the glass
#   - a 4th element "before" means before the pour (absinthe rinse, muddled mint); default "after".
# Drinks only show on the menu when their by-hand ingredients are ticked "on hand" in Admin.
#
# Ingredient amounts are facts (classic and IBA specs, written in ml); the descriptions and
# instructions were written for this project. GPL-2.0 like the rest of the code.
#
# [[ingredient]]: the generic ingredients the drinks use.
#   aliases: other names for the same thing (matched against ingredients already in the
#            database, e.g. names from an old bartendro.db), so nothing is duplicated.
#   brands:  specific bottles that can stand in for it; an existing ingredient with one of
#            these names is linked to it (Kahlua -> Coffee Liqueur) unless it already has a link.
#   generic: this is a specific kind of another ingredient (Reposado Tequila -> Tequila): it can
#            make drinks that ask for the generic one, but not the other way round.
#   manual:  never on a pump (bitters, mint, dairy - too hard to clean out of the lines).
#   on_hand: starts out ticked as on hand when added (ice); otherwise tick it in Admin.
# [[drink]]: ingredients = [[amount, unit, ingredient], ...]; pumped units ml, cl or oz.
#   instructions: anything else before the pour ("Pour into a shaker.")
#   finish: what the guest does after the pour

