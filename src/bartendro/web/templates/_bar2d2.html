{# Bar2D2 (the Bar2D2 party): an astromech dome on a Dalek skirt whose bumps are peristaltic pumps,
   balancing a tray with a martini glass on its plunger like the party robot. Drawn for this
   project. Colours are --b2-* variables with defaults. #}

  <defs>
    <linearGradient id="b2-dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset=".55" stop-color="var(--b2-dome, #c3c9d2)"/>
      <stop offset="1" stop-color="#8d96a3"/>
    </linearGradient>
    <linearGradient id="b2-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dee5"/>
      <stop offset=".35" stop-color="var(--b2-body, #f5f7fa)"/>
      <stop offset="1" stop-color="#c4cbd4"/>
    </linearGradient>
    <clipPath id="b2-dome-clip"><path d="M80 110 A70 70 0 0 1 220 110 Z"/></clipPath>

      <circle r="15.5" fill="var(--b2-dark, #343a43)" stroke="#15181d" stroke-width="2"/>
      <circle r="12.6" fill="#59626e"/>

            stroke-width="3.2" stroke-linecap="round"/>
      <g stroke="#d5dbe2" stroke-width="2.4" stroke-linecap="round">
        <line x2="0" y2="-7.4"/><line x2="6.4" y2="3.7"/><line x2="-6.4" y2="3.7"/>
      </g>
      <g fill="#eef1f5" stroke="#15181d" stroke-width="1.1">
        <circle cy="-7.4" r="2.8"/><circle cx="6.4" cy="3.7" r="2.8"/><circle cx="-6.4" cy="3.7" r="2.8"/>
      </g>
      <circle r="2.6" fill="var(--b2-blue, #2a5db0)" stroke="#15181d" stroke-width="1"/>
      <path d="M-11 -5 A12 12 0 0 1 -3 -12" fill="none" stroke="#fff" stroke-width="1.6" opacity=".45"
            stroke-linecap="round"/>

  <g fill="#fff" opacity=".9"><circle cx="125.8" cy="19.8" r="1.8"/><circle cx="177" cy="8" r="2.3"/></g>

  <!-- olive-pick arm (the gun stick) -->

    <line x1="226" y1="142" x2="276" y2="128" stroke="#1d2128" stroke-width="8"/>
    <line x1="226" y1="142" x2="276" y2="128" stroke="#c3c9d2" stroke-width="4"/>

    <circle cx="286" cy="124" r="2.8" fill="#d8402f"/>

  <!-- the Dalek plunger arm, balancing a tray with a martini glass on its suction cup -->
  <g stroke-linecap="round">
    <path d="M74 140 Q58 136 44 122" fill="none" stroke="#1d2128" stroke-width="11"/>
    <path d="M74 140 Q58 136 44 122" fill="none" stroke="#c3c9d2" stroke-width="5.5"/>

  <g transform="translate(44 124) rotate(-12)">

    <g transform="rotate(-14 38 73)">
      <path d="M15 46 L38 73 L61 46 A23 8.5 0 0 1 15 46 Z" fill="var(--b2-drink, #f3a96c)" stroke="#1d2128"

  <use href="#b2-pump" x="220.7" y="241" transform="translate(220.7 241) scale(.85) translate(-220.7 -241)"/>
  <use href="#b2-pump" x="72.6" y="284" transform="translate(72.6 284) scale(.85) translate(-72.6 -284)"/>
  <use href="#b2-pump" x="124.2" y="284" transform="translate(124.2 284) scale(.85) translate(-124.2 -284)"/>
  <use href="#b2-pump" x="175.8" y="284" transform="translate(175.8 284) scale(.85) translate(-175.8 -284)"/>
  <use href="#b2-pump" x="227.4" y="284" transform="translate(227.4 284) scale(.85) translate(-227.4 -284)"/>
  <use href="#b2-pump" x="65.9" y="327" transform="translate(65.9 327) scale(.85) translate(-65.9 -327)"/>
  <use href="#b2-pump" x="122.0" y="327" transform="translate(122.0 327) scale(.85) translate(-122.0 -327)"/>
  <use href="#b2-pump" x="178.0" y="327" transform="translate(178.0 327) scale(.85) translate(-178.0 -327)"/>
  <use href="#b2-pump" x="234.1" y="327" transform="translate(234.1 327) scale(.85) translate(-234.1 -327)"/>
  <rect x="26" y="344" width="248" height="15" rx="4" fill="var(--b2-dark, #343a43)" stroke="#1d2128" stroke-width="3.2"/>

  <!-- midsection: slatted shoulders -->

  <g stroke="#e9edf2" stroke-width="4.5" stroke-linecap="round">
    <line x1="92" y1="126" x2="90" y2="165"/><line x1="106" y1="126" x2="105" y2="165"/>
    <line x1="120" y1="126" x2="120" y2="165"/><line x1="134" y1="126" x2="134" y2="165"/>
    <line x1="148" y1="126" x2="148" y2="165"/><line x1="162" y1="126" x2="162" y2="165"/>
    <line x1="176" y1="126" x2="176" y2="165"/><line x1="190" y1="126" x2="190" y2="165"/>
    <line x1="204" y1="126" x2="205" y2="165"/><line x1="216" y1="126" x2="218" y2="165"/>
  </g>
  <circle cx="74" cy="140" r="9" fill="var(--b2-dark, #343a43)" stroke="#1d2128" stroke-width="3.2"/>
  <circle cx="226" cy="142" r="9" fill="var(--b2-dark, #343a43)" stroke="#1d2128" stroke-width="3.2"/>
  <rect x="74" y="107" width="152" height="14" rx="4" fill="var(--b2-dark, #343a43)" stroke="#1d2128" stroke-width="3.2"/>

  <g stroke="#1d2128" stroke-width="2">

      <rect x="195" y="44" width="9" height="16" rx="2" fill="#c3c9d2"/>
      <ellipse cx="199.5" cy="44" rx="6" ry="4" fill="var(--b2-lamp, #ffb547)"/>
    </g>
  </g>
  <!-- dome -->

    <rect x="80" y="93" width="140" height="3" fill="#8d96a3"/>

    <path d="M128 42 L146 41 L146 52 L128 53 Z"/>

  <path d="M100 76 A54 54 0 0 1 138 47" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>

        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="132" cy="80" r="6.5" fill="#2b313a"/>
  <circle cx="128.5" cy="76.5" r="2.6" fill="#fff" opacity=".85"/>
  <circle cx="169" cy="66" r="3.4" fill="var(--b2-lamp, #ffb547)" stroke="#1d2128" stroke-width="1.5"/>
  <circle cx="122" cy="102" r="2.5" fill="#d8402f"/>

    <line x1="182" y1="88" x2="228" y2="77" stroke="#c3c9d2" stroke-width="3.5"/>

  <g fill="#c3c9d2" stroke="#1d2128" stroke-width="1.5">

    <ellipse cx="218" cy="79.4" rx="2" ry="6.5" transform="rotate(-13 218 79.4)"/>

  <ellipse cx="232" cy="76" rx="5.5" ry="10" transform="rotate(-13 232 76)" fill="#1d2128"/>
  <ellipse cx="233" cy="75.7" rx="3.4" ry="7" transform="rotate(-13 233 75.7)" fill="var(--b2-eye, #7fd3ff)"/>

</svg>
