<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dadada">
<title>{% block title %}{{ bot_name }}{% endblock %}</title>
<link rel="icon" href="/static/img/icon.ico">
<link rel="stylesheet" href="/static/style.css">
{% if theme_css %}<style>{{ theme_css | safe }}</style>{% endif %}
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="top">
  <nav>
    <a href="/" class="{{ 'on' if nav == 'drinks' }}">Cocktails</a>
    <a href="/shots" class="{{ 'on' if nav == 'shots' }}">Shots</a>
    <a href="/admin" class="{{ 'on' if nav == 'admin' }}">Admin</a>
  </nav>
  <a class="logo" href="/">
    {% if party and party.title %}<span class="party-title">{{ party.title }}</span>{% endif %}
    {% if party and party.logo %}<img class="full" src="/uploads/{{ party.logo }}" alt="">
    {% else %}<img class="full" src="/static/img/bartendro-logo.png" alt="{{ bot_name }}">{% endif %}
    <img class="robot" src="/static/img/partyrobot.png" alt="">
  </a>
</header>
{% if banner %}<div class="demo-banner">{{ banner }}</div>{% endif %}
<div id="statusbar" class="statusbar state-{{ status.state }}" data-state="{{ status.state }}">
  <span id="status-text"></span>
</div>
<main>
  <div class="frame"><div class="panel">
{% block content %}{% endblock %}
  </div></div>
</main>

<div id="overlay" class="overlay" hidden>
  <div class="overlay-box">
    <img class="sick-robot" src="/static/img/sick_party_robot.png" alt="">
    <div id="overlay-spinner" class="spinner"></div>
    <h2 id="overlay-title"></h2>
    <p id="overlay-text"></p>
    <ul id="overlay-manual"></ul>
    <p id="overlay-finish"></p>
    <div class="overlay-buttons">
      <button id="overlay-reset" class="btn danger" hidden>Reset</button>
      <button id="overlay-go" class="btn go" hidden>Pour</button>
      <button id="overlay-close" class="btn" hidden>OK</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script>window.BARTENDRO = {{ {"status": status, "metric": opts.metric} | tojson }};</script>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
